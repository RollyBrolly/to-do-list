<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<p id="taskCounter">Tasks: 0</p>
<div id="customAlert" class="customAlert">
    <div class="alertBox">
        <p id="alertMSG"></p>
        <button id="alertBtn">OK</button>
    </div>
</div>
<div id="customConfirm" class="customConfirm">
    <div class="alertBox">
        <p id="confirmMSG"></p>
        <div class="confirmBtn">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>
    </div>
</div>
<div id="editModal" class="customConfirm">
    <div class="alertBox">
        <p>Edit Task</p>

        <input
            type="text"
            id="editInput"
            class="editInput"
        >

        <div class="confirmBtn">
            <button id="saveEditBtn">SAVE</button>
            <button id="cancelEditBtn">CANCEL</button>
        </div>
    </div>
</div>
<body>
    <div class="colorPalette">
        <img src="purplepalette.png" alt="purple" class="purple">
        <img src="yellowpalette.png" alt="yellow" class="yellow">
    </div>
    <div class="container">
        <div class="card">
            <h1>To-Do List</h1>
            <div class="row">
                <input type="text" placeholder="Add task" class="inputBox" id="inputBox">
                <button class="addBtn" id="addBtn">ADD</button>
            </div>
            <div id="taskContainer" class="taskContainer">

            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
